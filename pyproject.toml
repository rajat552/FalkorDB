[tool.poetry]
name = "company-brain"
version = "1.0.0"
license = "MIT"
description = "Enterprise RAG / GraphRAG knowledge intelligence platform for IT helpdesk and SRE teams using FalkorDB"
authors = ["FalkorDB <info@falkordb.com>"]
readme = "README.md"
repository = "https://github.com/rajat552/FalkorDB"
keywords = ["RAG", "Graph-RAG", "KnowledgeGraph", "FalkorDB", "FastAPI"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
falkordb = ">=1.7.0"
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"
pydantic = ">=2.8.0"
python-dotenv = ">=1.0.1"
typing-extensions = ">=4.12.0"
beautifulsoup4 = ">=4.12.0"
pypdf = ">=4.2.0"
backoff = ">=2.2.1"
ratelimit = ">=2.2.1"
openai = ">=1.35.0"
google-generativeai = ">=0.8.0"
fix-busted-json = ">=0.0.18"
ollama = ">=0.2.1"
httpx = ">=0.27.0"
python-multipart = ">=0.0.9"

[tool.poetry.group.test.dependencies]
pytest = ">=8.2.0"
anyio = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
ipykernel = ">=6.29.0"
sphinx = ">=7.3.0"
sphinx-rtd-theme = ">=2.0.0"
pandas = ">=2.2.0"
jupyter = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
